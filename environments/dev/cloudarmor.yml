apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: dhg-rateauto-dev-backend-config
  namespace: dhg-rateauto-dev-namespace
spec:
  timeoutSec: 1500
  # ----------------------------------------------------------------
  # Cloud Armor — Uncomment when security policy is created
  # Requires paid GCP account + quota increase for SECURITY_POLICIES
  # Create policy first:
  #   gcloud compute security-policies create dhg-rateauto-widget-ui-pol \
  #     --description="Cloud Armor security policy for DHG RateAuto" \
  #     --project=dhg-vaccine-rateauto-nonpord
  # ----------------------------------------------------------------
  # securityPolicy:
  #   name: dhg-rateauto-widget-ui-pol
  healthCheck:
    checkIntervalSec: 30
    timeoutSec: 10
    healthyThreshold: 1
    unhealthyThreshold: 3
    type: HTTP