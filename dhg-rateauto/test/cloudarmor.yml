apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: dhg-rateauto-dev-backend-config
  namespace: dhg-rateauto-dev-namespace
spec:
  timeoutSec: 1500
  # NOTE: Cloud Armor security policies require a paid GCP project.
  # Quota 'SECURITY_POLICIES' is 0 on free tier. Uncomment below when on a paid project.
  # securityPolicy:
  #   name: dhg-rateauto-widget-ui-pol
  healthCheck:
    checkIntervalSec: 30
    timeoutSec: 10
    healthyThreshold: 1
    unhealthyThreshold: 3
    type: HTTP