apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dhg-rateauto-test-ingress
  namespace: dhg-rateauto-test-namespace
  annotations:
    kubernetes.io/ingress.class: "gce"
    networking.gke.io/managed-certificates: dhg-rateauto-test-cert
    kubernetes.io/ingress.global-static-ip-name: "dhg-rateauto-test-static-ip"
    kubernetes.io/ingress.allow-http: "false"
    networking.gke.io/v1beta1.FrontendConfig: dhg-rateauto-test-frontend-config

spec:
  rules:
    - host: gcpcloudhub.shop
      http:
        paths:

          # Vaccine Fee
          - path: /vaccinefee/api
            pathType: Prefix
            backend:
              service:
                name: dhg-rateauto-vaccinefee-service
                port:
                  number: 5000

          - path: /vaccinefee
            pathType: Prefix
            backend:
              service:
                name: dhg-rateauto-vaccinefee-service
                port:
                  number: 80
